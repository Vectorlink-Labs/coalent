[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coalent"
version = "0.7.0.post1"
description = "A real-time, provenance-invalidated cognitive cache layer for AI agents and RAG."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Nisarg Pujara", email = "nisarg.pujara@vectorlinklabs.com" }]
keywords = [
  "rag", "llm", "agents", "context", "cache", "provenance",
  "langgraph", "crewai", "mcp", "context-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.24"]
langgraph = ["langgraph>=0.2"]
# mcp is pinned >=2.0: coalent.mcp targets the SDK's MCPServer API (renamed from the
# 1.x FastMCP) and is tested against 2.x only — 1.x support would be an untested claim.
mcp = ["mcp>=2.0"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
server = ["fastapi>=0.110"]
redis = ["redis>=5.0"]
qdrant = ["qdrant-client>=1.7"]
chroma = ["chromadb>=0.4"]
pgvector = ["psycopg[binary]>=3.1"]
# ruff is capped: CI installs the newest release, and 0.16 enables new default rules the
# tree is not yet formatted for (tracked as a follow-up lint modernization).
dev = ["pytest>=7.0", "pytest-cov", "mypy>=1.8", "ruff>=0.4,<0.16"]

[project.scripts]
coalent = "coalent.cli:main"
coalent-mcp = "coalent.mcp:main"

[project.urls]
Homepage = "https://github.com/Vectorlink-Labs/coalent"
Repository = "https://github.com/Vectorlink-Labs/coalent"
Documentation = "https://coalent.ai/docs"
Issues = "https://github.com/Vectorlink-Labs/coalent/issues"

[tool.hatch.build.targets.sdist]
# integrations/ ships as its own PyPI package (langchain-coalent) — keep the
# coalent sdist scoped to the library itself. benchmarks/ lives in the repo
# (reproduction package), not in the pip artifact.
exclude = ["integrations/", "benchmarks/", ".venv*", "*.log"]

[tool.hatch.build.targets.wheel]
packages = ["src/coalent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "openai: v0.4 accuracy tier — needs a real OPENAI_API_KEY; skipped offline",
]
filterwarnings = [
  # v0.7 default-read-path resolution: the suite runs the hermetic HashingEmbedder
  # (conftest), so every bare construction resolves to "unit" and would warn. The
  # warning itself is pinned in test_v07_default_read_path.py via pytest.warns.
  "ignore:coalent. read_path was not set:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# The optional FastAPI receiver (events/http.py, `server` extra) uses `@app.post`,
# whose type is unknown when fastapi isn't installed — so the documented `.[dev]`
# gate (no server extra) doesn't flag it as an untyped decorator.
[[tool.mypy.overrides]]
module = "coalent.events.http"
disallow_untyped_decorators = false
