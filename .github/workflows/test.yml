name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,fast]"
      - run: ruff check src tests
      # Analyze at the matrix interpreter's version: pip resolves per-version deps
      # (numpy >= 2.5 is 3.12-only and its PEP 695 stubs cannot parse under a 3.10
      # analysis target), so each job must type-check the world it actually installed.
      - run: mypy src --python-version ${{ matrix.python-version }}
      - run: pytest tests/ -q
  zero-dep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"   # NO numpy: the pure-Python core must gate green alone
      - run: pytest tests/ -q
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,fast,mcp,openai]"
      - run: pytest tests/test_mcp_server.py -q
  langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . && pip install -e "integrations/langchain-coalent[dev]"
      - run: pytest integrations/langchain-coalent/tests -q
      - run: ruff check integrations/langchain-coalent/src
